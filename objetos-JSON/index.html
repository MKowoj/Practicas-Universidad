<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad JSON y Objetos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gestión de Productos</h1>

    <section>
        <h2>Formulario 1: Crear Producto</h2>
        <form id="form-crear">
            <label for="sku">SKU:</label>
            <input type="text" id="sku" required>
            
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>
            
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" required>
            
            <label for="precio">Precio:</label>
            <input type="number" id="precio" step="0.01" required>
            
            <button type="submit">Generar JSON</button>
        </form>
        <p><strong>Resultado JSON:</strong> <span id="resultado-json">Esperando datos...</span></p>
    </section>

    <hr>

    <section>
        <h2>Formulario 2: Recibir Datos</h2>
        <form id="form-recibir">
            <label for="input-json">Introduce la cadena JSON:</label>
            <textarea id="input-json" rows="4" required></textarea>
            
            <button type="submit">Convertir y Agregar a Tabla</button>
        </form>
    </section>

    <section>
        <h2>Inventario Registrado</h2>
        <table id="tabla-productos">
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Nombre</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
            </tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
